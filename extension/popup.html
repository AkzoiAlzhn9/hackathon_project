<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 300px; padding: 20px; font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; }
        .card { background: #2d2d2d; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { margin: 0 0 15px 0; color: #00d4ff; font-size: 18px; text-align: center; }
        input { width: 100%; padding: 10px; background: #3d3d3d; border: 1px solid #555; border-radius: 6px; color: white; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: linear-gradient(45deg, #007bff, #00d4ff); border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .footer { font-size: 10px; color: #888; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>AI VIDEO TUTOR</h2>
        <input id="vid" placeholder="Введите Video ID...">
        <button id="start">АКТИВИРОВАТЬ ИИ</button>
        <div class="footer">Local Edge AI Engine v1.0</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
<head><meta charset="UTF-8"></head>
